[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzykg"
version = "1.4.3"
description = "Binarisation and t-norm composition on fuzzy knowledge graphs: multislice reference, calibrated null test, expert-labelled criteria (reference implementation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hai Bang Truong", email = "truonghaibang@siu.edu.vn" }]
keywords = ["fuzzy graphs", "modularity", "community detection", "interval type-2 fuzzy sets", "t-norms", "OWA", "knowledge graphs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "python-igraph>=0.10",
  "leidenalg>=0.10",
  "scikit-learn>=1.3",
  "numba>=0.59",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
mooc = ["requests"]

[tool.setuptools.packages.find]
include = ["fuzzykg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
